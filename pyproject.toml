[project]
name = "cargo"
version = "0.1.0"
description = "AI agent for tracking air cargo (AWB) and sea containers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.137.1",
    "hiredis>=3.4.0",
    "httpx>=0.28.1",
    "openai>=2.41.1",
    "openpyxl>=3.1.5",
    "playwright>=1.60.0",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
